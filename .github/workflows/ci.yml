name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  html:
    name: Validate HTML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lint HTML with htmlhint
        run: npx --yes htmlhint@1 "*.html"

  links:
    name: Check links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links with lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # Exclude hosts that block automated checkers (LinkedIn returns 999,
          # font preconnect roots 404), plus our own canonical/OG URLs: those
          # point at bensiverly.com and 404 until the page is deployed, so they
          # are never verifiable in-PR. Internal navigation uses relative links,
          # still checked locally via --root-dir. Keeps the check meaningful, not flaky.
          args: >-
            --no-progress
            --max-concurrency 4
            --max-retries 3
            --accept 200,206,403,429,999
            --root-dir "${{ github.workspace }}"
            --exclude "linkedin\.com"
            --exclude "fonts\.gstatic\.com"
            --exclude "fonts\.googleapis\.com"
            --exclude "bensiverly\.com"
            "*.html" "README.md"
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Page invariants, internal links, sitemap coverage, script syntax,
      # plant-dataset integrity, and the agent contract (each tool page's
      # scripts run in node:vm). Zero dependencies: just node:test.
      - name: Run test suite
        run: node --test
      # tokens.css and the stamped chrome are generated and committed; both
      # generators are zero-dependency, so this job still needs no install.
      - name: Check generated files are current
        run: node build-tokens.js --check && node build-pages.js --check
      - name: Validate sitemap.xml is well-formed
        run: |
          python3 -c "import xml.dom.minidom; xml.dom.minidom.parse('sitemap.xml'); print('sitemap.xml is well-formed')"

  agent-contract:
    name: Agent contract (browser)
    runs-on: ubuntu-latest
    # Required: the tool pages in headless Chrome must give the outputs in
    # test/fixtures/agent-contract.json, and each prefilled link must show what
    # the tool shows. Puppeteer 25 needs Node 22.12 or later.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dev dependencies
        run: npm ci
      - name: Run check-browser.js agent-contract
        run: node check-browser.js agent-contract

  browser:
    name: Browser checks (non-blocking)
    runs-on: ubuntu-latest
    # Overflow, first-screen boxes, the menu from the keyboard, forced colours,
    # more contrast, print page counts, the Writing pages (their poems'
    # lines, Serotiny's chapters and how each piece prints) and 05 Consulting
    # (its first screen, copy buttons and the rate card on one Letter page),
    # in headless Chrome. Advisory for now.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dev dependencies
        run: npm ci
      - name: Run check-browser.js
        run: node check-browser.js overflow first-screen menu tool-keys forced-colors more-contrast print writing consulting
